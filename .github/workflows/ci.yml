name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Build + alle Tests mit ClamAV)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: ClamAV installieren
        run: sudo apt-get update && sudo apt-get install -y clamav-daemon
      - name: Dienst des Pakets stoppen (Tests starten einen eigenen clamd)
        run: sudo systemctl stop clamav-daemon clamav-freshclam || true
      - run: dotnet build -c Release
      # Die Windows-Testprojekte (Windows-APIs, WPF) werden hier nur gebaut; ausgeführt werden sie im Windows-Job.
      - name: Tests (Kern, inkl. End-to-End-Tests der Kommandozeile)
        run: dotnet test tests/UScan.Core.Tests -c Release --no-build --logger "trx;LogFileName=linux.trx" --results-directory TestResults
      - name: Kerntests dürfen nicht übersprungen worden sein
        shell: bash
        run: |
          if grep -q 'outcome="NotExecuted"' TestResults/*.trx; then
            echo "::error::Integrationstests wurden übersprungen (clamd nicht gefunden)"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: TestResults

  windows:
    name: Windows (Build + alle Tests mit ClamAV)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: ClamAV installieren (Chocolatey)
        run: choco install clamav -y --no-progress
      - name: clamd finden
        shell: pwsh
        run: |
          $clamd = Get-Item -Path "C:\ProgramData\chocolatey\lib\clamav\tools\clamav-*\clamd.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $clamd) { Write-Error "clamd.exe nicht gefunden"; exit 1 }
          "USCAN_CLAMD=$($clamd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "clamd: $($clamd.FullName)"
      - run: dotnet build -c Release
      - name: Tests
        run: dotnet test -c Release --no-build --logger trx --results-directory TestResults
      - name: Oberfläche startet (Smoke-Test mit Bildschirmfoto)
        shell: pwsh
        run: |
          $exe = "src\UScan.Desktop\bin\Release\net10.0-windows\UScan.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          $p.Refresh()
          if ($p.HasExited) { Write-Error "UScan.exe wurde mit Code $($p.ExitCode) beendet"; exit 1 }
          Write-Host "Fenstertitel: '$($p.MainWindowTitle)'"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force -Path TestResults | Out-Null
          $bmp.Save("TestResults\ui-dashboard.png")
          $title = $p.MainWindowTitle
          Stop-Process -Id $p.Id
          if ($title -ne "UScan") { Write-Error "Hauptfenster 'UScan' nicht gefunden (Titel: '$title')"; exit 1 }
      - name: Keine Tests dürfen übersprungen worden sein
        shell: pwsh
        run: |
          if (Select-String -Path TestResults\*.trx -Pattern 'outcome="NotExecuted"' -Quiet) {
            Write-Error "Tests wurden übersprungen"; exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults
